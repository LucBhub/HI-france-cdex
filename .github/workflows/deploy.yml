name: Deploy to Production VM

on:
  #  push:
  #    branches: [ "main" ]
  workflow_dispatch: # Permet de lancer manuellement depuis l'interface GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          # Utilisez soit la clé SSH (recommandé), soit le mot de passe
          key: ${{ secrets.VM_SSH_KEY }}
          password: ${{ secrets.VM_PASSWORD }}
          port: 22
          script: |
            # Adaptation pour Windows (PowerShell) ou Linux
            # On navigue vers le dossier (ajuster le chemin selon votre VM)
            cd C:\Users\${{ secrets.VM_USER }}\Documents\Hyperviseur-Antigravity || cd /home/${{ secrets.VM_USER }}/hyperviseur-antigravity

            # Récupération du code
            git pull origin main

            # Injection de la clé API pour le build (sans passer par .env)
            export NEXT_PUBLIC_OPENWEATHER_API_KEY="${{ secrets.NEXT_PUBLIC_OPENWEATHER_API_KEY }}"

            # Redémarrage des conteneurs
            # Le -d lance en arrière plan, --build force la recompilation si nécessaire
            docker compose up -d --build

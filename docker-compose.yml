services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${HOST_IP}:3001
        NEXT_PUBLIC_RELAY_API_URL: https://${HOST_IP}:3001/api/control
        NEXT_PUBLIC_OPENWEATHER_API_KEY: ${NEXT_PUBLIC_OPENWEATHER_API_KEY:-}
    container_name: ${HYPERVISEUR_CONTAINER_PREFIX:-hyperviseur}-frontend
    env_file:
      - ${HYPERVISEUR_ENV_FILE:-.env.example}
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    environment:
      INTERNAL_API_URL: http://backend:3002
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://localhost:3001}
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./certs:/app/certs

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${HYPERVISEUR_CONTAINER_PREFIX:-hyperviseur}-backend
    env_file:
      - ${HYPERVISEUR_ENV_FILE:-.env.example}
    restart: unless-stopped
    ports:
      - "${BACKEND_HTTPS_PORT:-3001}:3001"
      - "${BACKEND_INTERNAL_PORT:-3002}:3002"
    volumes:
      - ./backend/db:/app/db
      - ./backend/index.js:/app/index.js
      - ${HYPERVISEUR_ENV_FILE:-.env.example}:/app/.env:ro
      - ./certs:/certs
    environment:
      PORT: 3001
      POLLING_SERVICE_TOKEN: ${POLLING_SERVICE_TOKEN:-}
      # Database Config
      NODE_ENV: production
      CORS_ORIGINS: https://${HOST_IP}:3000
      FRONTEND_BASE_URL: https://${HOST_IP}:3000
      AZURE_SENDER_EMAIL: ${AZURE_SENDER_EMAIL:-L.boillat@reden.solar}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      DB_NAME: ${DB_NAME:-hyperviseur}
      MQTT_URL: ${MQTT_URL:-mqtt://mqtt-broker:1883}
      COMMAND_MODE: ${COMMAND_MODE:-dry_run}
      COMMAND_LIVE_ENABLED: ${COMMAND_LIVE_ENABLED:-false}
      COMMAND_DRY_RUN_PUBLISH: ${COMMAND_DRY_RUN_PUBLISH:-true}
    command: ["npm", "start"]
    depends_on:
      postgres:
        condition: service_healthy
      mqtt-broker:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3002/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  polling-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${HYPERVISEUR_CONTAINER_PREFIX:-hyperviseur}-polling-service
    env_file:
      - ${HYPERVISEUR_ENV_FILE:-.env.example}
    restart: unless-stopped
    command: ["npm", "run", "poll"]
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      INTERNAL_API_URL: http://backend:3002
      POLLING_SERVICE_TOKEN: ${POLLING_SERVICE_TOKEN:-}
      NODE_TLS_REJECT_UNAUTHORIZED: 0
      # Database Config (if polling service needs direct DB access in future, though it interacts via API mostly)
      # But current polling service calls API, so maybe not strictly needed, but good to have env consistency
      NODE_ENV: production
    volumes:
      - ${HYPERVISEUR_ENV_FILE:-.env.example}:/app/.env:ro
      - ./backend/polling-service.js:/app/polling-service.js
      - ./backend/lib:/app/lib
      - ./certs:/certs

  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: ${HYPERVISEUR_CONTAINER_PREFIX:-hyperviseur}-mqtt-sandbox
    restart: unless-stopped
    ports:
      - "${MQTT_HOST_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/sandbox.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  mqtt-simulator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${HYPERVISEUR_CONTAINER_PREFIX:-hyperviseur}-mqtt-simulator
    env_file:
      - ${HYPERVISEUR_ENV_FILE:-.env.example}
    restart: unless-stopped
    command: ["npm", "run", "mqtt:simulator"]
    depends_on:
      mqtt-broker:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      DB_NAME: ${DB_NAME:-hyperviseur}
      MQTT_URL: ${MQTT_URL:-mqtt://mqtt-broker:1883}
      COMMAND_MODE: ${COMMAND_MODE:-dry_run}
      COMMAND_LIVE_ENABLED: ${COMMAND_LIVE_ENABLED:-false}
      COMMAND_DRY_RUN_PUBLISH: ${COMMAND_DRY_RUN_PUBLISH:-true}
    volumes:
      - ${HYPERVISEUR_ENV_FILE:-.env.example}:/app/.env:ro
      - ./backend/mqtt-simulator.js:/app/mqtt-simulator.js
      - ./backend/db:/app/db

  postgres:
    image: postgres:15-alpine
    container_name: ${HYPERVISEUR_CONTAINER_PREFIX:-hyperviseur}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-hyperviseur}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-hyperviseur}",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  backup-service:
    image: postgres:15-alpine
    container_name: ${HYPERVISEUR_CONTAINER_PREFIX:-hyperviseur}-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      DB_NAME: ${DB_NAME:-hyperviseur}
    volumes:
      - ./backups:/backups
      - ./backend/scripts/backup.sh:/usr/local/bin/backup.sh
      - ./backend/scripts/restore.sh:/usr/local/bin/restore.sh
    # Run backup script periodically (e.g., every 24h = 86400s)
    # Start with a delay to let DB ensure it's up, then loop
    entrypoint: >
      /bin/sh -c "
        chmod +x /usr/local/bin/backup.sh;
        echo 'Backup scheduler started...';
        echo 'Running initial backup...';
        sleep 30;
        /usr/local/bin/backup.sh;
        while true; do
          echo 'Waiting 24h for next backup...';
          sleep 86400; 
          /usr/local/bin/backup.sh;
        done
      "

volumes:
  postgres_data:

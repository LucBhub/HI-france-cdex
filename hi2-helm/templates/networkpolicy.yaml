{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hi2-helm.fullname" . }}-backend-policy
  labels:
    {{- include "hi2-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  podSelector:
    matchLabels:
      {{- include "hi2-helm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from frontend
    - from:
        - podSelector:
            matchLabels:
              {{- include "hi2-helm.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: frontend
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.port }}
    # Allow ingress from polling-service
    - from:
        - podSelector:
            matchLabels:
              {{- include "hi2-helm.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: polling
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.port }}
  egress:
    # Allow egress to postgres
    - to:
        - podSelector:
            matchLabels:
              {{- include "hi2-helm.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hi2-helm.fullname" . }}-frontend-policy
  labels:
    {{- include "hi2-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  podSelector:
    matchLabels:
      {{- include "hi2-helm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from anywhere (standard for Ingress/Service access)
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.frontend.service.port }}
  egress:
    # Allow egress to backend
    - to:
        - podSelector:
            matchLabels:
              {{- include "hi2-helm.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.port }}
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hi2-helm.fullname" . }}-postgres-policy
  labels:
    {{- include "hi2-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  podSelector:
    matchLabels:
      {{- include "hi2-helm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from backend
    - from:
        - podSelector:
            matchLabels:
              {{- include "hi2-helm.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: 5432
    # Allow ingress from polling-service
    - from:
        - podSelector:
            matchLabels:
              {{- include "hi2-helm.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: polling
      ports:
        - protocol: TCP
          port: 5432
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hi2-helm.fullname" . }}-polling-policy
  labels:
    {{- include "hi2-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: polling
spec:
  podSelector:
    matchLabels:
      {{- include "hi2-helm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: polling
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    # Allow egress to backend API
    - to:
        - podSelector:
            matchLabels:
              {{- include "hi2-helm.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.port }}
    # Allow egress to postgres (if needed)
    - to:
        - podSelector:
            matchLabels:
              {{- include "hi2-helm.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Allow egress to external Modbus devices (any IP)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 502
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
{{- end }}

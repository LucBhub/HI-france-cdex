apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hi2-helm.fullname" . }}-backend
  labels:
    {{- include "hi2-helm.labels" . | nindent 4 }}
    app: {{ include "hi2-helm.fullname" . }}-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "hi2-helm.selectorLabels" . | nindent 6 }}
      app: {{ include "hi2-helm.fullname" . }}-backend
  template:
    metadata:
      labels:
        {{- include "hi2-helm.selectorLabels" . | nindent 8 }}
        app: {{ include "hi2-helm.fullname" . }}-backend
    spec:
      imagePullSecrets:
        {{- with .Values.imagePullSecrets }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.backend.image.credentials }}
        - name: {{ .secretName }}
        {{- end }}
      containers:
        - name: backend
          command: ["npm", "start"]
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.service.port }}
            - containerPort: 3002
              name: internal-http
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- if .Values.backend.resources }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- end }}
          env:
            - name: PORT
              value: {{ .Values.backend.env.PORT | quote }}
            - name: INTERNAL_PORT
              value: "3002"
            - name: NODE_ENV
              value: {{ .Values.backend.env.NODE_ENV | default "production" | quote }}
            - name: CORS_ORIGINS
              value: {{ .Values.backend.env.CORS_ORIGINS | default "" | quote }}
            - name: DB_NAME
              value: {{ .Values.postgres.env.POSTGRES_DB | quote }}
            - name: DB_PORT
              value: {{ .Values.postgres.service.port | quote }}
            - name: DB_HOST
              value: {{ include "hi2-helm.fullname" . }}-postgres
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "hi2-helm.fullname" . }}-secrets
                  key: DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "hi2-helm.fullname" . }}-secrets
                  key: DB_PASS
            - name: POLLING_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "hi2-helm.fullname" . }}-secrets
                  key: POLLING_SERVICE_TOKEN
            - name: SUPERADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "hi2-helm.fullname" . }}-secrets
                  key: SUPERADMIN_USERNAME
            - name: SUPERADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "hi2-helm.fullname" . }}-secrets
                  key: SUPERADMIN_EMAIL
            - name: SUPERADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "hi2-helm.fullname" . }}-secrets
                  key: SUPERADMIN_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "hi2-helm.fullname" . }}-secrets
                  key: JWT_SECRET
            # --- AZURE AD ---
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "hi2-helm.fullname" . }}-secrets
                  key: AZURE_TENANT_ID
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "hi2-helm.fullname" . }}-secrets
                  key: AZURE_CLIENT_ID
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "hi2-helm.fullname" . }}-secrets
                  key: AZURE_CLIENT_SECRET
            - name: AZURE_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "hi2-helm.fullname" . }}-secrets
                  key: AZURE_REDIRECT_URI
            - name: FRONTEND_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "hi2-helm.fullname" . }}-secrets
                  key: FRONTEND_BASE_URL
            - name: AZURE_SENDER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "hi2-helm.fullname" . }}-secrets
                  key: AZURE_SENDER_EMAIL
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "hi2-helm.fullname" . }}-secrets
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ include "hi2-helm.fullname" . }}-secrets
                  key: SMTP_PORT
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "hi2-helm.fullname" . }}-secrets
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "hi2-helm.fullname" . }}-secrets
                  key: SMTP_PASS
        {{- if .Values.netclient.enabled }}
        # --- Sidecar Netclient (VPN) ---
        - name: netclient
          image: gravitl/netclient:latest
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
            privileged: true
          env:
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: netmaker-access-token
                  key: token
            - name: NETCLIENT_SILENT
              value: {{ .Values.netclient.silent | quote }}
        {{- end }}
